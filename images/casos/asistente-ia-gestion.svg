<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Diagrama: Consulta por chat → Agente de IA → Datos de la empresa → Respuesta + tope de gasto">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a14"/><stop offset="1" stop-color="#0a1d3d"/></linearGradient>
<linearGradient id="hi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d6efd"/><stop offset="1" stop-color="#00c8ff"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00c8ff"/></marker>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<rect x="120" y="30" width="560" height="100" rx="18" fill="rgba(255,255,255,0.05)" stroke="#1f4f8f" stroke-width="2"/>
<text x="400" y="93" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600" fill="#ffffff">Consulta por chat</text>
<line x1="400" y1="136" x2="400" y2="169" stroke="#00c8ff" stroke-width="4" marker-end="url(#ar)"/>
<rect x="120" y="175" width="560" height="100" rx="18" fill="url(#hi)" stroke="none" stroke-width="2"/>
<text x="400" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600" fill="#ffffff">Agente de IA</text>
<line x1="400" y1="281" x2="400" y2="314" stroke="#00c8ff" stroke-width="4" marker-end="url(#ar)"/>
<rect x="120" y="320" width="560" height="100" rx="18" fill="rgba(255,255,255,0.05)" stroke="#1f4f8f" stroke-width="2"/>
<text x="400" y="383" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600" fill="#ffffff">Datos de la empresa</text>
<line x1="400" y1="426" x2="400" y2="459" stroke="#00c8ff" stroke-width="4" marker-end="url(#ar)"/>
<rect x="120" y="465" width="560" height="100" rx="18" fill="rgba(255,255,255,0.05)" stroke="#1f4f8f" stroke-width="2"/>
<text x="400" y="528" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600" fill="#ffffff">Respuesta + tope de gasto</text>
</svg>